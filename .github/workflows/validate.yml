name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wallpaper:
    name: Wallpaper
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            fish \
            imagemagick \
            python3

      - name: Check Fish syntax
        shell: fish {0}
        run: |
          fish --no-execute tests/validate-wallpaper.fish

      - name: Validate wallpaper
        shell: fish
        run: |
          tests/validate-wallpaper.fish